<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="880" height="660" role="img" aria-label="Black Voice brand lockup options">
  <title>Black Voice — lockup options</title>

  <rect x="0" y="0" width="880" height="660" fill="#FFFFFF"/>

  <!-- ============================ OPTION 1 ============================ -->
