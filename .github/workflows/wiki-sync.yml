name: Sync wiki

# The GitHub wiki is a separate git repository (<repo>.wiki.git). This workflow
# keeps it in step with the wiki/ folder so the docs live with the code and go
# through review like everything else.
#
# The path filter means it only runs when something under wiki/ actually
# changed - a push that touches only source code does not trigger it.

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Push even when nothing appears to have changed'
        type: boolean
        default: false

# Never let two syncs race each other onto the same wiki repo.
concurrency:
  group: wiki-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Publish wiki/ to the GitHub wiki
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Verify the wiki folder
        run: |
          if [ ! -d wiki ]; then
            echo "::error::No wiki/ folder in the repository."
            exit 1
          fi
          if [ ! -f wiki/Home.md ]; then
            echo "::error::wiki/Home.md is missing - the wiki needs a Home page."
            exit 1
          fi
          echo "Pages to publish:"
          find wiki -name '*.md' -printf '  %f\n' | sort

      - name: Clone the wiki repository
        env:
          # A PAT in WIKI_TOKEN takes precedence; the default token is used
          # otherwise. See the note at the bottom of this file.
          TOKEN: ${{ secrets.WIKI_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone \
              "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
              wiki-repo 2>clone-error.txt; then
            echo "::error::Could not clone the wiki repository."
            echo ""
            echo "The most likely cause is that the wiki has never been"
            echo "initialised. GitHub does not create <repo>.wiki.git until the"
            echo "first page is saved through the web UI."
            echo ""
            echo "Fix: open https://github.com/${GITHUB_REPOSITORY}/wiki,"
            echo "click 'Create the first page', save anything at all, then"
            echo "re-run this workflow. It will overwrite that page."
            echo ""
            sed 's/x-access-token:[^@]*@/x-access-token:***@/g' clone-error.txt
            exit 1
          fi

      - name: Copy the pages across
        run: |
          # --delete removes pages deleted from wiki/, but .git must survive.
          rsync -a --delete --exclude '.git' wiki/ wiki-repo/
          echo "Wiki repository now contains:"
          find wiki-repo -name '*.md' -printf '  %f\n' | sort

      - name: Commit and push
        working-directory: wiki-repo
        env:
          FORCE: ${{ inputs.force }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet && [ "$FORCE" != "true" ]; then
            echo "Wiki is already up to date; nothing to push."
            exit 0
          fi

          git commit -m "Sync wiki from ${GITHUB_SHA:0:7}

          Source: ${GITHUB_REPOSITORY}@${GITHUB_SHA}
          Generated by the wiki-sync workflow - edit wiki/ in the repository,
          not the wiki itself."

          git push origin HEAD
          echo "Pushed. https://github.com/${GITHUB_REPOSITORY}/wiki"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Wiki sync"
            echo ""
            if [ -d wiki-repo ]; then
              echo "Published $(find wiki-repo -name '*.md' | wc -l) pages to"
              echo "[the wiki](https://github.com/${GITHUB_REPOSITORY}/wiki)."
            else
              echo "The wiki repository could not be cloned - see the log above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

# ---------------------------------------------------------------------------
# If the push fails with 403, the default GITHUB_TOKEN is not permitted to write
# to this wiki. Create a fine-grained PAT with write access to the repository,
# add it as a repository secret named WIKI_TOKEN, and re-run - the clone step
# above already prefers it when present.
# ---------------------------------------------------------------------------
